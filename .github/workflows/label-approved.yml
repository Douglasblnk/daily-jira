name: Label PR on 2 Approvals

on:
  pull_request_review:
    types: [submitted]

jobs:
  label-if-approved:
    runs-on: ubuntu-latest

    steps:
      - name: Check approvals and label
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const approvedReviews = new Set();

            for (const review of reviews) {
              if (review.state === 'APPROVED') {
                approvedReviews.add(review.user.login);
              }
            }

            if (approvedReviews.size >= 1) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['ready-to-merge'] // change this to your desired label
              });
            }
